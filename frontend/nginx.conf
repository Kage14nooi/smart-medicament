server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy des appels API vers le service gateway du reseau docker-compose
    location /api/ {
        proxy_pass http://gateway:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Routage cote client (React Router) : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
